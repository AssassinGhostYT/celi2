<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxia - Celisbeth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="webgl"></canvas>

<div class="letter-modal" id="letter-modal" aria-hidden="true" hidden>
  <button class="letter-close" id="letter-close" type="button" aria-label="Cerrar carta">×</button>
  <p class="letter-hint">Toca la carta para darle la vuelta</p>
  <div class="letter-card" id="letter-card" role="button" tabindex="0" aria-label="Dar la vuelta a la carta">
    <div class="letter-card-inner">
      <div class="letter-face letter-front">
        <img id="letter-image" alt="">
        <div class="letter-caption"><span id="letter-number"></span><h2 id="letter-title"></h2></div>
      </div>
      <div class="letter-face letter-back">
        <span class="letter-heart">♥</span>
        <p id="letter-message"></p>
        <span class="letter-signoff">Con todo mi amor, para ti</span>
      </div>
    </div>
  </div>
</div>

<button class="music-toggle" id="music-toggle" type="button" aria-label="Activar la música">🔇</button>
<div class="music-hint" id="music-hint">🎵 Toca la pantalla para activar la música</div>
<div id="music-player" aria-hidden="true"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.132.2",
    "three/addons/": "https://esm.sh/three@0.132.2/examples/jsm/"
  }
}
</script>

<script type="module" src="script.js"></script>
<script src="cards-ui.js"></script>
<script src="music.js"></script>
</body>
</html>
