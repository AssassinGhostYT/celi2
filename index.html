<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxia - Celisbeth</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="photo-card.css">
</head>
<body>
<canvas class="webgl"></canvas>

<div class="letter-modal" id="letter-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Carta de recuerdo" hidden>
  <button class="letter-close" id="letter-close" type="button" aria-label="Cerrar carta">×</button>
  <p class="letter-hint">Un recuerdo para ti <span aria-hidden="true">✦</span> Toca la carta para girarla</p>
  <div class="letter-card" id="letter-card" role="button" tabindex="0" aria-label="Dar la vuelta a la carta">
    <div class="letter-card-inner">
      <div class="letter-face letter-front">
        <img id="letter-image" alt="">
        <div class="letter-caption"><span id="letter-number"></span><h2 id="letter-title"></h2><p class="letter-front-note">Un instante nuestro, guardado para siempre <span aria-hidden="true">♥</span></p></div>
      </div>
      <div class="letter-face letter-back">
        <div class="letter-back-ornament" aria-hidden="true">✧　♥　✧</div>
        <span class="letter-back-label">PARA TI, CON TODO MI AMOR</span>
        <span class="letter-heart" aria-hidden="true">♥</span>
        <p id="letter-message"></p>
        <span class="letter-signoff">Con todo mi amor,<br><strong>siempre tuyo</strong> <span aria-hidden="true">♡</span></span>
        <div class="letter-back-ornament letter-back-ornament-bottom" aria-hidden="true">✧　♡　✧</div>
      </div>
    </div>
  </div>
</div>

<button class="music-toggle" id="music-toggle" type="button" aria-label="Activar la música">🔇</button>
<div class="music-hint" id="music-hint">🎵 Toca la pantalla para activar la música</div>
<div id="music-player" aria-hidden="true"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.132.2",
    "three/addons/": "https://esm.sh/three@0.132.2/examples/jsm/"
  }
}
</script>

<script type="module" src="interactive-scene.js"></script>
<script src="cards-ui.js"></script>
<script src="music.js"></script>
</body>
</html>
